[theme]
base="dark"
primaryColor="#6366f1"
backgroundColor="#09090b"
secondaryBackgroundColor="#18181b"
textColor="#fafafa"
font="sans serif"

[server]
# ── Container-safe settings ──
headless = true
address = "0.0.0.0"
port = 8501
maxUploadSize = 50
enableXsrfProtection = true
enableCORS = false
fileWatcherType = "none"

[browser]
gatherUsageStats = false
