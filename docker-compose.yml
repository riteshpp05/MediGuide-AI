# ══════════════════════════════════════════════════════════════
# MediGuide AI — Docker Compose (Production - React + FastAPI)
# ══════════════════════════════════════════════════════════════
# Usage:
#   docker compose up -d          → Start in background
#   docker compose down           → Stop and remove containers
#   docker compose logs -f        → Follow live logs
#   docker compose up -d --build  → Rebuild and restart
# ══════════════════════════════════════════════════════════════

services:
  # ── MediGuide AI Application ─────────────────────────────
  mediguide:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: mediguide-ai
    restart: unless-stopped

    # ── Port mapping ──
    # Maps host port 8000 to container port 8000
    # Access the app at http://localhost:8000
    ports:
      - "8000:8000"

    env_file:
      - .env

    # ── Persistent storage volumes ──
    volumes:
      - mediguide_chatbot_db:/home/mediguide/app/chatbot.db
      - mediguide_cache_db:/home/mediguide/app/answer_cache.db
      - mediguide_meta_db:/home/mediguide/app/threads_meta.db
      - mediguide_faiss:/home/mediguide/app/faiss_index
      - mediguide_logs:/home/mediguide/app/logs

    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"
        reservations:
          memory: 2G
          cpus: "1.0"

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mediguide_chatbot_db:
    driver: local
  mediguide_cache_db:
    driver: local
  mediguide_meta_db:
    driver: local
  mediguide_faiss:
    driver: local
  mediguide_logs:
    driver: local
